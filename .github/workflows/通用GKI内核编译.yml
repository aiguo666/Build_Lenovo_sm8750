# auto_fetch_google_gki_build.yml
name: Auto Fetch Google GKI Kernel Builder

on:
  workflow_dispatch:
    inputs:
      # 核心输入：谷歌内核manifest标识符
      android_kernel_tag:
        description: "谷歌内核标识符 (格式: android12-5.10, common-android12-5.10-2025-12, android-5.10)"
        required: true
        type: string
        default: "common-android12-5.10-2025-12"
      
      # 可选：指定特定分支
      specific_branch:
        description: "指定分支 (留空使用默认)"
        required: false
        type: string
        default: ""
      
      # 内核配置
      defconfig_target:
        description: "构建目标/defconfig"
        required: false
        type: string
        default: "gki_defconfig"
      
      # 功能选项
      ksu_integration:
        description: "KSU集成选项"
        required: true
        type: choice
        options:
          - 'none'
          - 'SukiSU'
          - 'ReSukiSU'
        default: 'ReSukiSU'
      
      enable_susfs:
        description: "启用SUSFS"
        required: false
        default: true
        type: boolean
      
      enable_kpm:
        description: "启用KPM"
        required: false
        default: true
        type: boolean
      
      # 构建优化
      enable_lz4_zstd:
        description: "启用LZ4/ZSTD优化"
        required: false
        default: true
        type: boolean
      
      enable_adios:
        description: "启用ADIOS I/O调度器"
        required: false
        default: true
        type: boolean
      
      # 工具链
      clang_version:
        description: "Clang版本"
        required: false
        type: choice
        options:
          - 'r510928'  # Clang 18
          - 'r528052'  # Clang 20
          - 'latest'
        default: 'r528052'

env:
  GOOGLE_KERNEL_SOURCE: "https://android.googlesource.com/kernel/manifest"
  GOOGLE_CLANG_SOURCE: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"

jobs:
  build:
    name: Build_Google_GKI_${{ github.event.inputs.android_kernel_tag }}
    runs-on: ubuntu-24.04
    env:
      KERNEL_TAG: ${{ github.event.inputs.android_kernel_tag }}
      SPECIFIC_BRANCH: ${{ github.event.inputs.specific_branch }}
      DEFCONFIG: ${{ github.event.inputs.defconfig_target }}
      KSU_TYPE: ${{ github.event.inputs.ksu_integration }}
      ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs }}
      ENABLE_KPM: ${{ github.event.inputs.enable_kpm }}
      ENABLE_LZ4_ZSTD: ${{ github.event.inputs.enable_lz4_zstd }}
      ENABLE_ADIOS: ${{ github.event.inputs.enable_adios }}
      CLANG_VER: ${{ github.event.inputs.clang_version }}
    
    steps:
      - name: 🏗️ Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip bc ccache libssl-dev \
            rsync git-lfs libelf-dev device-tree-compiler \
            lz4 zstd p7zip-full aria2
          
          # 安装repo工具
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo 'export PATH="$HOME/bin:$PATH"' >> ~/.bashrc
          source ~/.bashrc
          
      - name: 🔄 Parse Kernel Tag
        id: parse_tag
        run: |
          echo "解析内核标识符: $KERNEL_TAG"
          
          # 解析标识符格式
          if [[ "$KERNEL_TAG" =~ ^common-(android[0-9]+-[0-9]+\.[0-9]+)-[0-9]{4}-[0-9]{2}$ ]]; then
            # 格式: common-android12-5.10-2025-12
            KERNEL_BASE_TAG="${BASH_REMATCH[1]}"
            IS_COMMON_TAG=true
          elif [[ "$KERNEL_TAG" =~ ^(android[0-9]+-[0-9]+\.[0-9]+)$ ]]; then
            # 格式: android12-5.10
            KERNEL_BASE_TAG="$KERNEL_TAG"
            IS_COMMON_TAG=false
          elif [[ "$KERNEL_TAG" =~ ^android-([0-9]+\.[0-9]+)$ ]]; then
            # 格式: android-5.10
            ANDROID_VERSION=$(echo "$KERNEL_TAG" | grep -oP 'android-\K[0-9]+' || echo "12")
            KERNEL_VERSION="${BASH_REMATCH[1]}"
            KERNEL_BASE_TAG="android${ANDROID_VERSION}-${KERNEL_VERSION}"
            IS_COMMON_TAG=false
          else
            echo "使用原始标识符: $KERNEL_TAG"
            KERNEL_BASE_TAG="$KERNEL_TAG"
            IS_COMMON_TAG=false
          fi
          
          # 提取Android版本和内核版本
          if [[ "$KERNEL_BASE_TAG" =~ android([0-9]+)-([0-9]+)\.([0-9]+) ]]; then
            ANDROID_VERSION="${BASH_REMATCH[1]}"
            KERNEL_MAJOR="${BASH_REMATCH[2]}"
            KERNEL_MINOR="${BASH_REMATCH[3]}"
            KERNEL_BASE="${KERNEL_MAJOR}.${KERNEL_MINOR}"
            KMI="android${ANDROID_VERSION}-${KERNEL_BASE}"
          else
            # 尝试从标识符中提取版本信息
            ANDROID_VERSION="12"  # 默认
            KERNEL_BASE="5.10"    # 默认
            KMI="android${ANDROID_VERSION}-${KERNEL_BASE}"
          fi
          
          echo "解析结果:"
          echo "KERNEL_BASE_TAG=$KERNEL_BASE_TAG" >> $GITHUB_ENV
          echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
          echo "KERNEL_BASE=$KERNEL_BASE" >> $GITHUB_ENV
          echo "KMI=$KMI" >> $GITHUB_ENV
          echo "IS_COMMON_TAG=$IS_COMMON_TAG" >> $GITHUB_ENV
          
          echo "✅ 标识符解析完成"
          echo "Android版本: $ANDROID_VERSION"
          echo "内核基础版本: $KERNEL_BASE"
          echo "KMI标识符: $KMI"
          
      - name: 📥 Fetch Google Kernel Source
        run: |
          echo "从Google开源仓库拉取内核源码..."
          echo "标识符: $KERNEL_TAG"
          echo "基础标签: $KERNEL_BASE_TAG"
          echo "是否通用标签: $IS_COMMON_TAG"
          
          # 设置Git配置
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          
          # 创建目录
          mkdir -p kernel_source
          cd kernel_source
          
          # 初始化repo
          echo "初始化repo仓库..."
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b $KERNEL_TAG \
            --depth=1
          
          # 尝试不同的manifest分支
          if [ $? -ne 0 ]; then
            echo "尝试使用基础标签: $KERNEL_BASE_TAG"
            repo init -u https://android.googlesource.com/kernel/manifest \
              -b $KERNEL_BASE_TAG \
              --depth=1 || \
            repo init -u https://android.googlesource.com/kernel/manifest \
              -b "android-$KERNEL_BASE" \
              --depth=1 || \
            repo init -u https://android.googlesource.com/kernel/manifest \
              -b "common-android$ANDROID_VERSION-$KERNEL_BASE" \
              --depth=1
          fi
          
          # 同步源码
          echo "同步内核源码..."
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags
          
          # 如果同步失败，尝试备用方案
          if [ $? -ne 0 ] || [ ! -f "build.config" ]; then
            echo "标准同步失败，尝试备选方案..."
            
            # 尝试直接克隆common内核
            cd ..
            rm -rf kernel_source
            mkdir kernel_source
            cd kernel_source
            
            # 尝试克隆common内核仓库
            COMMON_REPO="https://android.googlesource.com/kernel/common"
            echo "直接克隆common内核: $COMMON_REPO"
            git clone --depth=1 "$COMMON_REPO" -b "android-$KERNEL_BASE" .
            
            if [ $? -ne 0 ]; then
              echo "克隆common内核失败，尝试其他分支..."
              git clone --depth=1 "$COMMON_REPO" .
              
              # 检查是否存在指定分支
              if git branch -a | grep -q "android-$KERNEL_BASE"; then
                git checkout -b local-android-$KERNEL_BASE origin/android-$KERNEL_BASE
              fi
            fi
          fi
          
          # 验证源码
          if [ -f "Makefile" ]; then
            echo "✅ 内核源码拉取成功"
            
            # 提取完整版本信息
            KERNEL_MAJOR=$(grep -m1 '^VERSION =' Makefile | awk '{print $3}')
            KERNEL_PATCHLEVEL=$(grep -m1 '^PATCHLEVEL =' Makefile | awk '{print $3}')
            KERNEL_SUBLEVEL=$(grep -m1 '^SUBLEVEL =' Makefile | awk '{print $3}')
            
            if [ -n "$KERNEL_MAJOR" ] && [ -n "$KERNEL_PATCHLEVEL" ]; then
              KERNEL_FULL="${KERNEL_MAJOR}.${KERNEL_PATCHLEVEL}"
              [ -n "$KERNEL_SUBLEVEL" ] && KERNEL_FULL="${KERNEL_FULL}.${KERNEL_SUBLEVEL}"
              
              echo "检测到的内核版本: $KERNEL_FULL"
              echo "KERNEL_FULL=$KERNEL_FULL" >> $GITHUB_ENV
              
              # 更新KMI
              echo "KMI=android$ANDROID_VERSION-${KERNEL_MAJOR}.${KERNEL_PATCHLEVEL}" >> $GITHUB_ENV
            fi
          else
            echo "❌ 内核源码拉取失败"
            exit 1
          fi
          
      - name: 🔧 Download Clang Toolchain
        run: |
          echo "下载Clang工具链: $CLANG_VER"
          cd kernel_source
          
          # 创建工具链目录
          mkdir -p prebuilts/clang/host/linux-x86
          
          # 下载指定版本的Clang
          if [ "$CLANG_VER" = "latest" ]; then
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main.tar.gz"
          else
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-$CLANG_VER.tar.gz"
          fi
          
          echo "下载Clang工具链: $CLANG_URL"
          curl -L "$CLANG_URL" | tar -xz -C prebuilts/clang/host/linux-x86/
          
          # 设置工具链路径
          CLANG_PATH=$(find prebuilts/clang/host/linux-x86 -name "clang" -type f | head -1)
          if [ -n "$CLANG_PATH" ]; then
            CLANG_DIR=$(dirname $(dirname "$CLANG_PATH"))
            echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
            echo "✅ Clang工具链下载完成: $CLANG_DIR"
          else
            echo "⚠️ 未找到clang二进制文件，尝试下载预编译版本"
            
            # 下载预编译的Clang
            wget -q https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-$CLANG_VER/clang-$CLANG_VER.zip \
              -O clang.zip || \
            wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-$(echo $CLANG_VER | tr -d 'r')/clang+llvm-$(echo $CLANG_VER | tr -d 'r')-x86_64-linux-gnu-ubuntu-20.04.tar.xz \
              -O clang.tar.xz
            
            if [ -f "clang.zip" ]; then
              unzip -q clang.zip -d prebuilts/clang/host/linux-x86/
              rm clang.zip
            elif [ -f "clang.tar.xz" ]; then
              tar -xf clang.tar.xz -C prebuilts/clang/host/linux-x86/
              rm clang.tar.xz
            fi
            
            CLANG_DIR=$(find prebuilts/clang/host/linux-x86 -maxdepth 2 -name "bin" -type d | head -1)
            CLANG_DIR=$(dirname "$CLANG_DIR")
            echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          fi
          
          # 显示工具链信息
          if [ -n "$CLANG_DIR" ] && [ -f "$CLANG_DIR/bin/clang" ]; then
            echo "工具链信息:"
            $CLANG_DIR/bin/clang --version | head -n 3
          fi
          
      - name: 🛠️ Apply Kernel Optimizations
        run: |
          cd kernel_source
          echo "应用内核优化补丁..."
          
          # 应用LZ4/ZSTD优化
          if [ "$ENABLE_LZ4_ZSTD" = "true" ]; then
            echo "应用LZ4/ZSTD优化补丁..."
            
            # 下载补丁
            curl -L -o lz4.patch https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8750/main/zram_patch/001-lz4.patch
            curl -L -o zstd.patch https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8750/main/zram_patch/002-zstd.patch
            
            [ -f "lz4.patch" ] && patch -p1 -l < lz4.patch 2>/dev/null || true
            [ -f "zstd.patch" ] && patch -p1 -l < zstd.patch 2>/dev/null || true
            rm -f lz4.patch zstd.patch
          fi
          
          # 应用ADIOS I/O调度器
          if [ "$ENABLE_ADIOS" = "true" ]; then
            echo "应用ADIOS I/O调度器补丁..."
            curl -L -o adios.patch https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8750/main/lib/adios_ioscheduler.patch
            [ -f "adios.patch" ] && patch -p1 -l < adios.patch 2>/dev/null || true
            rm -f adios.patch
          fi
          
      - name: 🛡️ Setup KernelSU
        if: ${{ env.KSU_TYPE != 'none' }}
        run: |
          cd kernel_source
          echo "设置KernelSU: $KSU_TYPE"
          
          if [ "$KSU_TYPE" = "ReSukiSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
            KSU_VER=$(cd KernelSU && expr $(git rev-list --count main) + 30700 2>/dev/null || echo 10000)
          elif [ "$KSU_TYPE" = "SukiSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s builtin
            KSU_VER=$(cd KernelSU && expr $(git rev-list --count main) + 37185 2>/dev/null || echo 10000)
          fi
          
          echo "KSU_VERSION=$KSU_VER" >> $GITHUB_ENV
          echo "✅ KernelSU设置完成: v$KSU_VER"
          
      - name: 🗂️ Setup SUSFS
        if: ${{ env.ENABLE_SUSFS == 'true' }}
        run: |
          cd kernel_source
          echo "设置SUSFS支持..."
          
          # 根据KMI下载对应的SUSFS补丁
          SUSFS_PATCH_URL="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-$KMI/kernel_patches/50_add_susfs_in_$KMI.patch"
          
          echo "尝试下载SUSFS补丁: $SUSFS_PATCH_URL"
          curl -L -o susfs.patch "$SUSFS_PATCH_URL" || \
          curl -L -o susfs.patch "https://gitlab.com/simonpunk/susfs4ksu/-/raw/main/kernel_patches/50_add_susfs_in_$KMI.patch" || \
          echo "⚠️ 无法下载SUSFS补丁"
          
          if [ -f "susfs.patch" ]; then
            patch -p1 -l < susfs.patch 2>/dev/null || echo "SUSFS补丁应用可能失败"
            rm susfs.patch
            echo "✅ SUSFS补丁应用完成"
          else
            echo "⚠️ 未找到匹配的SUSFS补丁，跳过"
          fi
          
      - name: ⚙️ Configure Kernel
        run: |
          cd kernel_source
          echo "配置内核defconfig..."
          
          # 检查defconfig文件
          DEFCONFIG_FILE="arch/arm64/configs/$DEFCONFIG"
          if [ ! -f "$DEFCONFIG_FILE" ]; then
            echo "Defconfig文件不存在: $DEFCONFIG"
            echo "可用defconfig文件:"
            find arch/arm64/configs -name "*.defconfig" 2>/dev/null | head -10
            exit 1
          fi
          
          # 创建自定义配置
          cp "$DEFCONFIG_FILE" "arch/arm64/configs/gki_custom_defconfig"
          CONFIG_FILE="arch/arm64/configs/gki_custom_defconfig"
          
          # 启用KernelSU
          if [ "$KSU_TYPE" != "none" ]; then
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
            echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
            
            if [ "$KSU_TYPE" = "ReSukiSU" ]; then
              echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%-Re-AiGuo"' >> "$CONFIG_FILE"
            fi
          fi
          
          # 启用SUSFS
          if [ "$ENABLE_SUSFS" = "true" ]; then
            echo "# SUSFS配置" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$CONFIG_FILE"
          fi
          
          # 通用优化配置
          echo "# 通用优化" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$CONFIG_FILE"
          
          # ADIOS调度器
          if [ "$ENABLE_ADIOS" = "true" ]; then
            echo "# ADIOS I/O调度器" >> "$CONFIG_FILE"
            echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> "$CONFIG_FILE"
            echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> "$CONFIG_FILE"
          fi
          
          echo "✅ 内核配置完成"
          
      - name: 🏗️ Build Kernel
        run: |
          cd kernel_source
          echo "开始构建内核..."
          echo "版本: $KERNEL_FULL"
          echo "KMI: $KMI"
          echo "Android: $ANDROID_VERSION"
          
          # 设置环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          
          # 设置工具链路径
          if [ -n "$CLANG_DIR" ]; then
            export PATH="$CLANG_DIR/bin:$PATH"
            export CLANG_TRIPLE=aarch64-linux-gnu-
          fi
          
          # 显示编译器信息
          echo "编译器信息:"
          which clang && clang --version | head -n 1 || echo "clang未找到"
          which ld.lld && ld.lld --version | head -n 1 || echo "ld.lld未找到"
          
          # 设置构建信息
          export KBUILD_BUILD_TIMESTAMP="$(date -R)"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          export KBUILD_BUILD_USER="gki-builder"
          
          # 清理输出目录
          rm -rf out
          
          # 配置内核
          echo "运行defconfig..."
          make O=out gki_custom_defconfig
          
          # 验证配置
          echo "验证配置..."
          grep "CONFIG_KSU=y" out/.config && echo "✓ KSU已启用" || echo "⚠️ KSU未启用"
          
          # 编译内核
          echo "编译内核Image..."
          time make -j$(nproc) O=out \
            CC="clang" \
            LD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            Image 2>&1 | tee build.log
            
          # 检查构建结果
          if [ -f "out/arch/arm64/boot/Image" ]; then
            IMAGE_SIZE=$(stat -c%s "out/arch/arm64/boot/Image")
            echo "✅ 内核编译成功!"
            echo "镜像大小: $((IMAGE_SIZE / 1024 / 1024)) MB"
            file out/arch/arm64/boot/Image
          else
            echo "❌ 内核编译失败"
            tail -100 build.log
            exit 1
          fi
          
      - name: 🔧 Apply KPM Patch
        if: ${{ env.ENABLE_KPM == 'true' && env.KSU_TYPE != 'none' }}
        run: |
          cd kernel_source
          echo "应用KPM补丁..."
          
          if [ -f "out/arch/arm64/boot/Image" ]; then
            cd out/arch/arm64/boot
            curl -LO https://github.com/ShirkNeko/SukiSU_KernelPatch_patch/releases/download/0.12.2/patch_linux
            chmod +x patch_linux
            ./patch_linux || echo "KPM补丁应用可能失败，继续..."
            [ -f "oImage" ] && mv oImage Image
          fi
          
      - name: 📦 Package Artifacts
        run: |
          cd kernel_source
          echo "打包构建产物..."
          
          # 创建输出目录
          OUTPUT_NAME="kernel_${KERNEL_FULL}_android${ANDROID_VERSION}_${KSU_TYPE}"
          mkdir -p "$OUTPUT_NAME"
          
          # 复制内核镜像
          cp out/arch/arm64/boot/Image "$OUTPUT_NAME/kernel.img"
          
          # 创建构建信息文件
          cat > "$OUTPUT_NAME/build_info.txt" << EOF
          =================================
          谷歌GKI内核自动构建
          =================================
          构建时间: $(date)
          
          版本信息:
          - 内核版本: $KERNEL_FULL
          - Android版本: $ANDROID_VERSION
          - KMI标识符: $KMI
          - 源码标识符: $KERNEL_TAG
          
          功能配置:
          - KernelSU: $KSU_TYPE v$KSU_VERSION
          - SUSFS支持: $ENABLE_SUSFS
          - KPM支持: $ENABLE_KPM
          - LZ4/ZSTD优化: $ENABLE_LZ4_ZSTD
          - ADIOS调度器: $ENABLE_ADIOS
          
          工具链:
          - Clang版本: $CLANG_VER
          - 构建系统: Google GKI
          
          源码来源:
          - Manifest: https://android.googlesource.com/kernel/manifest/+/refs/heads/$KERNEL_TAG
          
          构建环境:
          - GitHub Actions Runner
          - Ubuntu 24.04
          =================================
          EOF
          
          # 复制构建日志
          cp build.log "$OUTPUT_NAME/build.log" 2>/dev/null || true
          cp out/.config "$OUTPUT_NAME/kernel.config" 2>/dev/null || true
          
          # 打包
          tar -czf "$OUTPUT_NAME.tar.gz" "$OUTPUT_NAME"
          
          echo "✅ 打包完成: $OUTPUT_NAME.tar.gz"
          ls -lh "$OUTPUT_NAME.tar.gz"
          
      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kernel_${{ env.KERNEL_FULL }}_android${{ env.ANDROID_VERSION }}
          path: |
            kernel_source/kernel_${{ env.KERNEL_FULL }}_android${{ env.ANDROID_VERSION }}_${{ env.KSU_TYPE }}.tar.gz
            kernel_source/out/arch/arm64/boot/Image
          
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "================================="
          echo "       谷歌GKI内核构建完成"
          echo "================================="
          echo "内核标识符: $KERNEL_TAG"
          echo "内核版本: $KERNEL_FULL"
          echo "Android版本: $ANDROID_VERSION"
          echo "KMI: $KMI"
          echo "KernelSU: $KSU_TYPE"
          echo "构建时间: $(date)"
          echo "================================="
          
          if [ -f "kernel_source/out/arch/arm64/boot/Image" ]; then
            echo "内核镜像:"
            echo "- 大小: $(ls -lh kernel_source/out/arch/arm64/boot/Image | awk '{print $5}')"
            echo "- 路径: kernel_source/out/arch/arm64/boot/Image"
          fi
